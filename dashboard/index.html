<!doctype html><meta charset="utf-8"><title>AI TikTok Shop Autopilot</title><style>body{font-family:Arial;background:#f5f6f8;margin:0;color:#111}header{background:#111;color:#fff;padding:22px}main{max-width:1100px;margin:20px auto;padding:0 15px}.card{background:#fff;padding:18px;border-radius:12px;margin:14px 0}input{padding:10px;margin:4px;border:1px solid #ddd;border-radius:8px}button{padding:10px 14px;border:0;border-radius:8px;background:#111;color:#fff;margin:4px;cursor:pointer}table{width:100%;background:#fff;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}</style><script>window.AUTOPILOT_API="";</script><header><h1>AI TikTok Shop Autopilot</h1><div>Gemini • Trends • Products • Videos • Queue</div></header><main><div class=card><h2>เพิ่มสินค้า</h2><input id=n placeholder="ชื่อสินค้า"><input id=p placeholder="ราคา"><input id=c placeholder="Commission"><input id=u placeholder="ลิงก์สินค้า"><input id=note placeholder="จุดขาย"><button onclick=add()>เพิ่ม</button></div><div class=card><h2>สินค้า</h2><table><thead><tr><th>สินค้า</th><th>ราคา</th><th>Commission</th><th>AI</th></tr></thead><tbody id=list></tbody></table></div></main><script>const A='http://localhost:8000';async function load(){let x=await fetch(A+'/products').then(r=>r.json());list.innerHTML=x.map(q=>`<tr><td>${q.name}</td><td>${q.price||''}</td><td>${q.commission||''}</td><td><button onclick="trend('${q.id}')">วิเคราะห์เทรนด์</button><button onclick="script('${q.id}')">สร้างสคริปต์</button></td></tr>`).join('')}async function add(){await fetch(A+'/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n.value,price:+p.value||null,commission:+c.value||null,url:u.value,notes:note.value})});load()}async function trend(id){let e=prompt('ข้อมูลเทรนด์ที่คุณมี เช่น {"views_growth":30,"sales_growth":15}','{}');if(e!==null)alert(await (await fetch(A+'/products/'+id+'/trend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({evidence:JSON.parse(e)})})).text())}async function script(id){alert(await (await fetch(A+'/products/'+id+'/scripts',{method:'POST'})).text());}load()</script>
