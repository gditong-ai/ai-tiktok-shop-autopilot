services:
  - type: web
    name: tiktok-autopilot-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tiktok-autopilot-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: APP_SECRET
        generateValue: true

  - type: web
    name: tiktok-autopilot-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: echo "Static dashboard ready"
    staticPublishPath: .
    plan: free

databases:
  - name: tiktok-autopilot-db
    plan: free
    databaseName: autopilot
    user: autopilot
